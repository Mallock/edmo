[package]
name = "ed-mission-operator"
version = "1.9.0"
description = "Elite Dangerous Mission Operator — always-on-top HUD with journal ingestion, LM Studio AI operator, and local Piper TTS"
authors = ["Mika Leiman"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# net/io-util carry the loopback station relay in radio.rs.
tokio = { version = "1", features = ["time", "net", "io-util"] }
cpal = "0.15"
hound = "3"
# Integrity checking for the large bundled-engine downloads (runtime + model).
sha2 = "0.10"

[target."cfg(windows)".dependencies]
# Screen glances (GDI capture) and the zip-packaged whisper build are
# Windows-only; Linux uses tar + skips glances.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-registry = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation",
    # Job objects: the OS kills the inference server when this process dies,
    # however it dies — including a Task Manager kill, which no shutdown hook
    # can catch.
    "Win32_System_JobObjects",
    # CreateJobObjectW is gated on Win32_Security (SECURITY_ATTRIBUTES) and the
    # extended-limit struct on Win32_System_Threading (IO_COUNTERS).
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
